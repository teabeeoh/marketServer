[project]
name = "market-server"
version = "0.1.0"
description = "Flask REST API server for financial market data and AI-powered investment analyses"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thomas Bolz", email = "thomas.bolz@gmail.com" }]
dependencies = [
    "flask>=3.0.0",
    "yfinance>=0.2.0",
    "gunicorn>=22.0.0",
    "anthropic>=0.40.0",
    "openpyxl>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]